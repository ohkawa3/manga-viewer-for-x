<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga Viewer for X</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #0f1419; --sub: #536471; --line: #cfd9de; --accent: #1d9bf0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0d; --fg: #e7e9ea; --sub: #8b98a5; --line: #2f3336; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 24px; }
  .field { padding: 16px 0; border-top: 1px solid var(--line); }
  .title { display: block; font-weight: 600; margin-bottom: 4px; }
  .desc { color: var(--sub); font-size: 13px; margin: 4px 0 10px; }
  select, input[type="number"] { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .checks input { accent-color: var(--accent); }
  .ratio-row { display: flex; align-items: center; gap: 12px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  input[type="number"] { width: 5em; }
  .actions { display: flex; align-items: center; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
  button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  #status { color: var(--sub); opacity: 0; transition: opacity .2s; }
  #status.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1 data-i18n="options_title"></h1>

  <div class="field">
    <label class="title" for="startMode" data-i18n="opt_start_title"></label>
    <p class="desc" data-i18n="opt_start_desc"></p>
    <select id="startMode"></select>
  </div>

  <div class="field">
    <div class="title" data-i18n="opt_modes_title"></div>
    <p class="desc" data-i18n="opt_modes_desc"></p>
    <div id="modeChecks" class="checks"></div>
  </div>

  <div class="field">
    <label class="title" for="baseRatioNum" data-i18n="opt_ratio_title"></label>
    <p class="desc" data-i18n="opt_ratio_desc"></p>
    <div class="ratio-row">
      <input type="range" id="baseRatioRange">
      <input type="number" id="baseRatioNum"> %
    </div>
  </div>

  <div class="actions">
    <button id="reset" type="button" data-i18n="opt_reset"></button>
    <span id="status" role="status" data-i18n="opt_saved"></span>
  </div>
</main>
<script src="config.js"></script>
<script src="options.js"></script>
</body>
</html>
